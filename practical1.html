<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [2,3,5,7,4]
        let sum = 0;
        let product = 1;
        for(let i=0;i<arr.length;i++){
            sum = sum + arr[i];
            product = product * arr[i];
        }
        document.write("Array Element are" + arr + "<br>")
        document.write("sum of array is" + sum + "<br>")
        document.write("Product of array is" + product + "<br>")
    </script>
</body>
</html>
